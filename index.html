<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StaticHub</title>
  <meta name="description" content="A personal hub of static mini-sites." />
  <style>
    :root {
      --navy: #0f172a;
      --navy-soft: #1e293b;
      --accent: #38bdf8;
      --accent-strong: #0ea5e9;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }
    .header {
      background: var(--navy);
      background-image: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      padding: 3rem 1.5rem 2.5rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }
    .header__inner { max-width: 1080px; margin: 0 auto; }
    .header__title {
      margin: 0;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .header__title .dot { color: var(--accent); }
    .header__subtitle {
      margin: 0.5rem 0 0;
      color: #94a3b8;
      font-size: 1rem;
    }
    .main { max-width: 1080px; margin: 0 auto; padding: 2.5rem 1.5rem 3rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .card {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.4rem 1.4rem 1.2rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.1);
      border-color: #cbd5e1;
    }
    .card__title {
      margin: 0 0 0.5rem;
      font-size: 1.15rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .card__desc {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.95rem;
      flex: 1;
    }
    .card__desc--empty { font-style: italic; opacity: 0.7; }
    .card__link {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--accent-strong);
      text-decoration: none;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      background: rgba(14, 165, 233, 0.08);
      transition: background 0.15s ease, color 0.15s ease;
    }
    .card__link:hover { background: rgba(14, 165, 233, 0.16); color: #0284c7; }
    .empty {
      text-align: center;
      max-width: 520px;
      margin: 2rem auto;
      padding: 2.5rem 1.5rem;
      background: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
    .empty__title { margin: 0 0 0.5rem; font-size: 1.3rem; }
    .empty__text { margin: 0; color: var(--muted); }
    code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      background: #e2e8f0;
      padding: 0.1rem 0.35rem;
      border-radius: 5px;
      font-size: 0.88em;
    }
    .footer {
      max-width: 1080px;
      margin: 0 auto;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <h1 class="header__title">Static<span class="dot">Hub</span></h1>
      <p class="header__subtitle">A personal hub of static mini-sites &middot; 0 sites</p>
    </div>
  </header>
  <main class="main">
      <div class="empty">
        <h2 class="empty__title">No sites yet</h2>
        <p class="empty__text">Copy the <code>_template/</code> folder to a new folder, edit its <code>site.json</code>, and push to <code>main</code>. Your first card will appear here.</p>
      </div>
  </main>
  <footer class="footer">
    Generated by build.js &middot; &copy; 2026
  </footer>
</body>
</html>
